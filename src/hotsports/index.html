<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>My first three.js app</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    .hotspot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: white;
      border: 2px solid black;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition: transform 0.3s;
    }

    .hotspot:hover {
      transform: scale(1.2);
    }

    .label {
      color: white;
      margin-top: 8px;
      text-align: center;
      font-size: 14px;
      white-space: nowrap;
    }

    .hotspot-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
  <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
  <script type="module" src="./main.js"></script>
</body>

</html>
